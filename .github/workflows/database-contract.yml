name: Database Contract
on: [push, pull_request]
jobs:
  database-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy
      - run: supabase db reset --local
      - run: supabase test db --local
      - run: bash supabase/tests/monthly_billing_concurrency.sh
