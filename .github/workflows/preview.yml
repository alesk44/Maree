name: Marée private preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maree-private-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Build and deploy isolated preview
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build preview
        run: bun run build

      - name: Deploy isolated Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name maree-jersey-preview

