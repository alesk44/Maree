name: Verify
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: local-ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - run: bun install --frozen-lockfile
      - run: deno check supabase/functions/notify-verification-request/index.ts supabase/functions/review-verification-email-action/index.ts
      - run: bun run build
      - run: bunx tsc --noEmit
      - run: bun run lint
      - run: bun run test
