name: Supabase migration tests

on:
  pull_request:
    branches: [main, "feature/**"]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

concurrency:
  group: supabase-db-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Database tests do not send email; Mailpit is not needed.
      # Excluding it also avoids binding its default host port (54324).
      - name: Start local Supabase
        run: supabase start --exclude mailpit
      - name: Rebuild database from repository migrations
        run: supabase db reset
      - name: Run pgTAP security contract tests
        run: supabase test db
      - name: Verify concurrent last-stock reservations
        run: bash supabase/tests/reservation_concurrency.sh
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
