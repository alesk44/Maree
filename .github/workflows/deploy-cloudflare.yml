name: Deploy isolated preview to Cloudflare Workers

# Preview deployment is deliberately manual. CI never publishes a Worker.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maree-private-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Check preview deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub Environment secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub Environment variable: CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build isolated preview (local data backend only)
        run: bun run build
        env:
          VITE_MAREE_PREVIEW_MODE: "true"
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_preview_unconfigured
      - name: Deploy isolated preview Worker
        run: bunx wrangler deploy --name maree-jersey-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
