name: Deploy private preview to Cloudflare Workers

# Preview deployment is deliberately manual. CI never publishes a Worker.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maree-private-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Check preview deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_REF: ${{ vars.VITE_SUPABASE_PROJECT_REF }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub Environment secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub Environment variable: CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$VITE_SUPABASE_URL" || (echo "Missing GitHub Environment variable: VITE_SUPABASE_URL" && exit 1)
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || (echo "Missing GitHub Environment secret: VITE_SUPABASE_PUBLISHABLE_KEY" && exit 1)
          test -n "$VITE_SUPABASE_PROJECT_REF" || (echo "Missing GitHub Environment variable: VITE_SUPABASE_PROJECT_REF" && exit 1)
          test -n "$SUPABASE_PRODUCTION_PROJECT_REF" || (echo "Missing GitHub Environment variable: SUPABASE_PRODUCTION_PROJECT_REF" && exit 1)
          test "$VITE_SUPABASE_PROJECT_REF" != "$SUPABASE_PRODUCTION_PROJECT_REF" || (echo "Preview must use a project different from production" && exit 1)
          case "$VITE_SUPABASE_URL" in
            "https://${VITE_SUPABASE_PROJECT_REF}.supabase.co") ;;
            *) echo "Preview URL must match VITE_SUPABASE_PROJECT_REF"; exit 1 ;;
          esac
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Deploy isolated preview Worker
        run: bunx wrangler deploy --name maree-jersey-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
